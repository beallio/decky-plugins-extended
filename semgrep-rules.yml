rules:
  - id: decky.python.dynamic-execution
    message: Dynamic Python execution requires review in a Decky plugin.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: decky.python.shell-command
    message: Python launches a command through a shell.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: decky.javascript.dynamic-execution
    message: Dynamic JavaScript execution requires review in a Decky plugin.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: decky.javascript.child-process-exec
    message: JavaScript launches a shell command through child_process.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: require("child_process").exec(...)
      - pattern: require("node:child_process").exec(...)

  - id: decky.generic.private-key
    message: A private-key block is embedded in shipped plugin content.
    severity: ERROR
    languages: [generic]
    pattern-regex: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
