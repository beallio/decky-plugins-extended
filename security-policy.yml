# Security audit policy configuration.
# This file controls which checks run, what thresholds are used, and
# whether findings block CI or are reported only.
version: "1"

enforcement:
  # "report-only": findings are surfaced in the job summary but do NOT
  #                fail the PR (exit 0 on security findings).
  # "enforce":     BLOCK findings exit 2; MANUAL_REVIEW exits 3.
  # Internal infrastructure failures always fail CI regardless of mode.
  # Held at report-only. The structural cap in #17 means no NEW audit can produce
  # a BLOCK from a behavioural rule, but the gate acts on the STORED
  # classification, and security-verdicts.json still holds eight BLOCK entries
  # written under the old rules. Enabling enforcement before those are rewritten
  # would exclude the same eight false positives that were removed on
  # 2026-08-04. Flip this only once the store has been repopulated by an audit
  # running under the current policy, or once the gate re-derives classification
  # from blocking_rule_ids rather than trusting the stored value.
  mode: report-only

# Corpus-tuned escalation weights. Detection is unchanged: every finding still
# appears in reports, but these platform-baseline rules no longer force review.
rule_classifications:
  # 21/42 releases (50.00%): mounting filesystems is routine system integration
  # on SteamOS, including access around its read-only root filesystem.
  PRIVILEGE_MOUNT: PASS_WITH_WARNINGS
  # 18/42 releases (42.86%): systemctl is the standard interface for the
  # services that system-integrating Decky plugins manage.
  PRIVILEGE_SYSTEMCTL: PASS_WITH_WARNINGS
  # 16/42 releases (38.10%): sudo is the expected route for plugin operations
  # that must cross SteamOS's unprivileged plugin boundary.
  PRIVILEGE_SUDO: PASS_WITH_WARNINGS
  # 15/42 releases (35.71%): shell-based plugins use sudo for the same ordinary
  # SteamOS integration work as Python plugins.
  PRIVILEGE_SUDO_SHELL: PASS_WITH_WARNINGS
  # 15/42 releases (35.71%): declaring Decky's root flag is common for plugins
  # that integrate with the operating system rather than only the UI.
  ROOT_ACCESS: PASS_WITH_WARNINGS

# Only deterministic structural facts may remove a release from the catalog.
# Overrides above run first: they may demote these rules, but rules outside this
# list are capped at MANUAL_REVIEW even if their detector labels them BLOCK.
# Duplicate normalised paths remain review-only because a legitimate release in
# the audited corpus contains one. A corrupt archive is an AUDIT_ERROR because
# the audit could not complete, not evidence that the artifact is malicious.
blockable_rules:
  - MALWARE
  - ARCHIVE_TRAVERSAL
  - ARCHIVE_ESCAPE_SYMLINK
  - ARCHIVE_BOMB_RATIO
  - ARCHIVE_BOMB_SIZE
  - ARCHIVE_SETUID_FILE
  - ARCHIVE_DEVICE_FILE
  - ARCHIVE_NAMED_PIPE
  - ARCHIVE_FILE_COUNT_EXCEEDED
  - ARCHIVE_SINGLE_FILE_TOO_LARGE

archive:
  # Maximum number of files allowed in a single release ZIP.
  max_files: 10000
  # Maximum total uncompressed size (bytes) across all archive members.
  max_uncompressed_bytes: 1073741824     # 1 GiB
  # Maximum uncompressed size of a single archive member (bytes).
  max_single_file_bytes: 536870912      # 512 MiB
  # Maximum allowed compression ratio (uncompressed / compressed).
  # Ratios above this limit indicate a potential zip-bomb.
  max_compression_ratio: 200
  # Maximum depth of nested directories inside the archive.
  max_path_depth: 30

vulnerabilities:
  # Minimum CVSSv3-equivalent severity that triggers a BLOCK classification.
  # Accepted values: "critical", "high", "medium", "low"
  block_severity: critical
  # Minimum severity that triggers MANUAL_REVIEW.
  review_severity: high

scanners:
  # enabled: false → scanner is skipped (status "skipped") and never blocks.
  # required: true → if the scanner is enabled and exits with anything other
  #                   than "passed" or "found_issue" the audit becomes
  #                   AUDIT_ERROR; "unsupported" → at least MANUAL_REVIEW.
  clamav:
    enabled: true
    required: true
  trivy:
    enabled: true
    required: true
  semgrep:
    enabled: true
    required: false
  osv_scanner:
    enabled: false
    required: false
  source_artifact_diff:
    enabled: true
    required: true

# Future integration point for catalog generation:
# catalog_generation:
#   require_classifications:
#     - PASS
#     - PASS_WITH_WARNINGS
#   # MANUAL_REVIEW requires an explicit unexpired allowlist entry keyed by
#   # artifact SHA-256, not just repository name or mutable release tag.
