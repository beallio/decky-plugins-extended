# Plugin Security Audit Workflow
#
# The checked-in policy is currently `enforce`: completed BLOCK and
# MANUAL_REVIEW results fail the PR only after all safe shard evidence has been
# aggregated and published as an artifact. Exit 1 is a run-global integrity
# failure and therefore publishes no aggregate output; exit 4 is a
# release-local incomplete result and remains publishable evidence.

name: Plugin Security Audit

on:
  pull_request:
    paths:
      - additional_plugins.txt
      - audit_plugins.py
      - generate_json.py
      - check_for_updates.py
      - plugin_release_utils.py
      - security-policy.yml
      - security-allowlist.yml
      - security-verdicts.json
      - semgrep-rules.yml
      - pyproject.toml
      - uv.lock
      - scripts/orchestration-hooks/quality-gates
      - scripts/orchestration/run-quality-gates
      - tests/**
      - .github/workflows/plugin-security-audit.yml
      - .github/workflows/scheduled-security-audit.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit mode: changed or all"
        required: false
        default: changed

permissions:
  contents: read

concurrency:
  group: "security-audit-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Local-equivalent quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml

      - name: Run Ruff, pytest, and verified actionlint gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/orchestration-hooks/quality-gates

      - name: Assert CI collection includes exact security regression node IDs
        run: |
          set -o pipefail
          collection_file="$RUNNER_TEMP/pytest-collection.txt"
          uv run pytest --collect-only -q > "$collection_file"
          cat "$collection_file"
          for node_id in \
            tests/test_catalog_gate.py::test_unknown_verdict_fails_open_with_explicit_identity_status \
            tests/test_enforcement_workflow.py::test_pull_request_audit_still_fails_on_enforcement_exit_codes \
            tests/test_workflow_selection.py::test_full_corpus_is_four_isolated_shards \
            tests/test_workflow_selection.py::test_workflow_executes_selector_for_required_path_classes[audit-only] \
            tests/test_audit_cache_invalidation.py::TestAuditCacheInvalidation::test_context_hash_covers_semgrep_rules_and_scanner_freshness
          do
            grep -Fqx -- "$node_id" "$collection_file" || {
              echo "::error::pytest collection missed node ID $node_id"
              exit 1
            }
          done

  audit-shards:
    name: Security Audit (shard ${{ matrix.shard_index }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml

      - name: Install required security scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg lsb-release clamav
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep_version="$(semgrep --version --disable-version-check)"
          [[ "$semgrep_version" == "1.132.0" ]] || {
            echo "::error::expected Semgrep 1.132.0, got $semgrep_version"
            exit 1
          }
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
          ls /var/lib/clamav/*.c?d >/dev/null
        timeout-minutes: 12

      - name: Determine audit mode
        id: selection
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            changed_paths="$(git diff --name-only "${base_ref}...HEAD")"
            audit_mode="$(printf '%s\n' "$changed_paths" | uv run python -m plugin_release_utils --select-audit-mode)"
          else
            audit_mode="${DISPATCH_MODE:-changed}"
          fi
          case "$audit_mode" in
            all) summary_state="full corpus selected (four shards)" ;;
            changed) summary_state="changed configured repositories" ;;
            none) summary_state="no configured repository changes" ;;
            *) echo "::error::invalid audit mode: $audit_mode"; exit 1 ;;
          esac
          echo "audit_mode=$audit_mode" >> "$GITHUB_OUTPUT"
          echo "summary_state=$summary_state" >> "$GITHUB_OUTPUT"

      - name: Record audit selection summary
        run: |
          {
            echo "## Security audit selection"
            echo
            echo "${{ steps.selection.outputs.summary_state }}"
            echo "Shard ${{ matrix.shard_index }} of 4"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run isolated audit shard
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_MODE: ${{ steps.selection.outputs.audit_mode }}
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          mkdir -p security-reports
          case "$AUDIT_MODE" in
            all) mode_args=(--all) ;;
            changed | none) mode_args=(--changed --base-ref "$BASE_REF") ;;
          esac
          set +e
          uv run python audit_plugins.py "${mode_args[@]}" \
            --shard-count 4 \
            --shard-index "${{ matrix.shard_index }}" \
            --output-dir security-reports \
            --verdict-delta security-reports/security-verdict-delta.json
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > security-reports/audit-exit.txt
          echo "audit_exit=${audit_exit}" >> "$GITHUB_OUTPUT"
          case "$audit_exit" in
            0 | 2 | 3 | 4)
              echo "publishable=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            1)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              echo "::error::unexpected audit exit $audit_exit"
              exit 1
              ;;
          esac
        timeout-minutes: 22

      - name: Upload isolated shard evidence
        if: always() && steps.audit.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-shard-${{ matrix.shard_index }}
          path: security-reports
          retention-days: 30
          if-no-files-found: warn

  aggregate-audit:
    name: Aggregate security audit shards
    needs: audit-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml

      - name: Download isolated shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: security-audit-shard-*
          path: shard-artifacts

      - name: Aggregate safe shard reports and deltas
        id: aggregate
        run: |
          shopt -s globstar nullglob
          exit_files=(shard-artifacts/**/audit-exit.txt)
          (( ${#exit_files[@]} == 4 )) || {
            echo "::error::expected four shard exit records"
            exit 1
          }
          for exit_file in "${exit_files[@]}"; do
            [[ "$(<"$exit_file")" != "1" ]] || {
              echo "::error::run-global audit integrity failure; aggregate evidence is unsafe"
              exit 1
            }
          done
          reports=(shard-artifacts/**/security-report.json)
          deltas=(shard-artifacts/**/security-verdict-delta.json)
          (( ${#reports[@]} == 4 && ${#deltas[@]} == 4 )) || {
            echo "::error::every shard must publish report and verdict delta"
            exit 1
          }
          mkdir -p security-reports
          set +e
          uv run python audit_plugins.py \
            --aggregate-reports "${reports[@]}" \
            --aggregate-verdict-deltas "${deltas[@]}" \
            --output-dir security-reports \
            --verdict-delta security-reports/security-verdict-delta.json
          audit_exit=$?
          set -e
          echo "audit_exit=${audit_exit}" >> "$GITHUB_OUTPUT"
          case "$audit_exit" in
            0 | 2 | 3 | 4)
              echo "publishable=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              exit "$audit_exit"
              ;;
          esac

      - name: Record aggregation summary
        if: always() && steps.aggregate.outputs.audit_exit != ''
        run: |
          {
            echo "## Security audit aggregation"
            echo
            if [[ "${{ steps.aggregate.outputs.publishable }}" == "true" ]]; then
              echo "Four isolated shard reports and verdict deltas were merged."
            else
              echo "Aggregation failed integrity checks; no aggregate evidence was published."
            fi
            echo "Aggregate exit: ${{ steps.aggregate.outputs.audit_exit }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate audit evidence
        if: always() && steps.aggregate.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-aggregate
          path: security-reports
          retention-days: 30
          if-no-files-found: warn

      - name: Apply PR enforcement result after publication
        if: always() && steps.aggregate.outputs.audit_exit != ''
        env:
          AUDIT_EXIT: ${{ steps.aggregate.outputs.audit_exit }}
        run: |
          case "$AUDIT_EXIT" in
            0) echo "Audit clean." ;;
            2) echo "::error::Audit produced BLOCK findings."; exit 2 ;;
            3) echo "::error::Audit produced MANUAL_REVIEW findings."; exit 3 ;;
            4) echo "::error::Audit has publishable release-local incompleteness."; exit 4 ;;
            *) echo "::error::unexpected audit exit $AUDIT_EXIT"; exit 1 ;;
          esac

  smoke-audit:
    name: Smoke audit (single release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml

      - name: Install required security scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg lsb-release clamav
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep_version="$(semgrep --version --disable-version-check)"
          [[ "$semgrep_version" == "1.132.0" ]]
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
          ls /var/lib/clamav/*.c?d >/dev/null
        timeout-minutes: 12

      - name: Run fast single-release smoke audit
        id: smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          uv run python audit_plugins.py \
            --repository https://github.com/beallio/SDH-Ludusavi \
            --latest-only \
            --skip-cache \
            --output-dir smoke-reports
          audit_exit=$?
          set -e
          echo "audit_exit=${audit_exit}" >> "$GITHUB_OUTPUT"
          case "$audit_exit" in
            0 | 2 | 3 | 4)
              echo "publishable=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              exit "$audit_exit"
              ;;
          esac

      - name: Upload smoke audit report
        if: always() && steps.smoke.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-smoke
          path: smoke-reports
          retention-days: 14
          if-no-files-found: warn
