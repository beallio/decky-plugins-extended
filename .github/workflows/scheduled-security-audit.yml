# Scheduled Plugin Security Audit
#
# Re-audits every configured plugin repository on a schedule to detect
# new releases or updated artifacts that may introduce security issues.
#
# Cache results by artifact SHA-256 so unchanged releases are not re-audited.
# Never automatically approves allowlist entries or modifies the allowlist.
#
# Cache key design:
#   - Restore key: audit-cache-v{POLICY_VERSION}-{hash(policy+impl)}
#   - Save key: audit-cache-v{POLICY_VERSION}-{hash(policy+impl)}-{run_id}
# This allows cache hits for compatible policy versions while writing a new
# entry after each run (so changes propagate on the next run).

name: Scheduled Security Audit

on:
  schedule:
    # Every 6 hours — matches the existing catalog-refresh schedule.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "scheduled-security-audit"
  cancel-in-progress: false

jobs:
  scheduled-audit:
    name: Scheduled Audit (all plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: "pyproject.toml"

      - name: Compute audit cache key
        id: cache-key
        run: |
          # Incorporate policy version, implementation, and allowlist into the
          # cache key so the cache is invalidated when any of them change.
          POLICY_HASH=$(sha256sum security-policy.yml security-allowlist.yml semgrep-rules.yml audit_plugins.py plugin_release_utils.py pyproject.toml | sha256sum | cut -c1-16)
          echo "restore_key=audit-cache-v1-${POLICY_HASH}" >> "$GITHUB_OUTPUT"
          echo "save_key=audit-cache-v1-${POLICY_HASH}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Restore audit cache
        # actions/cache v4.2.3
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .audit-cache
          key: ${{ steps.cache-key.outputs.save_key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore_key }}

      - name: Install optional security scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy || echo "::warning::trivy install failed"
          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep --version --disable-version-check
          sudo apt-get install -y --no-install-recommends clamav || {
            echo "::error::clamav install failed"
            exit 1
          }
          # Stop the auto-updater daemon so freshclam can run without lock conflicts.
          sudo systemctl stop clamav-freshclam || true
          # Update signature databases; fail loudly on error.
          sudo freshclam
          # Verify that usable signature databases are present.
          clamscan --version || { echo "::error::clamscan unavailable after install"; exit 1; }
          ls /var/lib/clamav/*.c?d 2>/dev/null || {
            echo "::error::No ClamAV signature databases found after freshclam"
            exit 1
          }
        timeout-minutes: 10

      - name: Snapshot published verdicts
        run: cp security-verdicts.json "$RUNNER_TEMP/security-verdicts-before.json"

      - name: Run audit on all configured repositories
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p security-reports
          set +e
          uv run python audit_plugins.py \
            --all \
            --output-dir security-reports \
            --cache-dir .audit-cache
          audit_exit=$?
          set -e
          echo "audit_exit=${audit_exit}" >> "$GITHUB_OUTPUT"

          # Under enforcement, exit 2 (BLOCK) and exit 3 (MANUAL_REVIEW) are
          # audit RESULTS, not failures of this step. Letting them fail here
          # would skip "Publish updated verdicts" and freeze the verdict store
          # at whatever it held before - which is precisely the stale-verdict
          # condition enforcement depends on the store not being in. Publish
          # first; the "Enforcement result" step below fails the job afterwards.
          # Exit 1 is an internal audit error and still fails immediately,
          # because a partially-written store must not be published.
          case "${audit_exit}" in
            0 | 2 | 3) exit 0 ;;
            *) exit "${audit_exit}" ;;
          esac
        timeout-minutes: 45

      - name: Publish updated verdicts
        env:
          BEFORE_VERDICTS: ${{ runner.temp }}/security-verdicts-before.json
        run: |
          if git diff --quiet -- security-verdicts.json; then
            echo "No verdict changes to publish."
            exit 0
          fi

          changed_count=$(uv run python - "$BEFORE_VERDICTS" security-verdicts.json <<'PY'
          import json
          import sys

          def flatten(path):
              with open(path, encoding="utf-8") as verdict_file:
                  verdicts = json.load(verdict_file)
              return {
                  (repository, release_id): verdict
                  for repository, releases in verdicts.items()
                  for release_id, verdict in releases.items()
              }

          before = flatten(sys.argv[1])
          after = flatten(sys.argv[2])
          changed = sum(
              before.get(key) != after.get(key) for key in before.keys() | after.keys()
          )
          print(changed)
          PY
          )

          git config user.name "decky-plugins-extended audit bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- security-verdicts.json
          git commit -m "chore(security): publish ${changed_count} changed verdicts"

          git status --porcelain
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi

          echo "Initial verdict push raced with another update; rebasing and retrying once."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforcement result
        if: always() && steps.audit.outputs.audit_exit != ''
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.audit_exit }}
        run: |
          # Runs after publication so an enforcement result can never withhold
          # the verdicts that produced it.
          case "${AUDIT_EXIT}" in
            0)
              echo "Audit clean under the current enforcement mode."
              ;;
            2)
              echo "::error::Audit produced BLOCK findings; see the job summary."
              exit 2
              ;;
            3)
              # MANUAL_REVIEW is a standing queue on a six-hourly sweep of the
              # whole corpus, not a regression. Failing the scheduled job on it
              # would keep this workflow permanently red and destroy the signal
              # that a real BLOCK would carry. New plugins are gated by the
              # pull_request audit, which still fails on exit 3.
              echo "::warning::Audit flagged releases for MANUAL_REVIEW; see the job summary."
              ;;
            *)
              echo "::error::Unexpected audit exit code ${AUDIT_EXIT}."
              exit 1
              ;;
          esac

      - name: Save audit cache
        # Save cache after scanning so updated entries persist on the next run.
        # A cache-save failure must not be interpreted as a passing audit.
        if: always()
        # actions/cache v4.2.3
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .audit-cache
          key: ${{ steps.cache-key.outputs.save_key }}

      - name: Add audit summary to job summary
        if: always()
        run: |
          if [[ -f security-reports/security-report.md ]]; then
            cat security-reports/security-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Scheduled Security Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit reports
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-security-audit-reports
          path: |
            security-reports/security-report.json
            security-reports/security-report.md
          retention-days: 90
          if-no-files-found: warn
