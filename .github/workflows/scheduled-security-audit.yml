# Scheduled Plugin Security Audit
#
# Every six hours this runs the full eligible-release corpus in four isolated
# shards. AUDIT_SCHEDULED tells the runtime not to claim scanner database
# freshness from a report cache when a database identity cannot be measured.
# The workflow cache keys still include the static scanner inputs; the runtime
# makes the final freshness decision.

name: Scheduled Security Audit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-audit
  cancel-in-progress: false

jobs:
  scheduled-audit:
    name: Scheduled Audit (shard ${{ matrix.shard_index }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard_index }}
      AUDIT_SCHEDULED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml

      - name: Compute audit cache key
        id: cache-key
        run: |
          POLICY_HASH=$(sha256sum security-policy.yml security-allowlist.yml security-verdicts.json semgrep-rules.yml audit_plugins.py plugin_release_utils.py pyproject.toml uv.lock | sha256sum | cut -c1-16)
          echo "restore_key=audit-cache-v2-${POLICY_HASH}-shard-${SHARD_INDEX}" >> "$GITHUB_OUTPUT"
          echo "save_key=audit-cache-v2-${POLICY_HASH}-shard-${SHARD_INDEX}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Restore audit cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .audit-cache
          key: ${{ steps.cache-key.outputs.save_key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore_key }}

      - name: Install required security scanners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wget apt-transport-https gnupg lsb-release clamav
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends trivy
          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep_version="$(semgrep --version --disable-version-check)"
          [[ "$semgrep_version" == "1.132.0" ]] || {
            echo "::error::expected Semgrep 1.132.0, got $semgrep_version"
            exit 1
          }
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
          ls /var/lib/clamav/*.c?d >/dev/null
        timeout-minutes: 12

      - name: Run audit on all configured repositories
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p security-reports
          set +e
          uv run python audit_plugins.py \
            --all \
            --shard-count 4 \
            --shard-index "$SHARD_INDEX" \
            --output-dir security-reports \
            --cache-dir .audit-cache \
            --verdict-delta security-reports/security-verdict-delta.json
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > security-reports/audit-exit.txt
          echo "audit_exit=${audit_exit}" >> "$GITHUB_OUTPUT"
          case "$audit_exit" in
            0 | 2 | 3 | 4)
              echo "publishable=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            1)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              echo "::error::unexpected audit exit $audit_exit"
              exit 1
              ;;
          esac
        timeout-minutes: 45

      - name: Save audit cache
        if: always() && steps.audit.outputs.publishable == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .audit-cache
          key: ${{ steps.cache-key.outputs.save_key }}

      - name: Upload isolated scheduled evidence
        if: always() && steps.audit.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-security-audit-shard-${{ matrix.shard_index }}
          path: security-reports
          retention-days: 90
          if-no-files-found: warn

  aggregate-and-publish:
    name: Aggregate and publish scheduled verdicts
    needs: scheduled-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: pyproject.toml

      - name: Download isolated scheduled evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: scheduled-security-audit-shard-*
          path: shard-artifacts

      - name: Aggregate safe shard reports and deltas
        id: aggregate
        run: |
          shopt -s globstar nullglob
          exit_files=(shard-artifacts/**/audit-exit.txt)
          (( ${#exit_files[@]} == 4 )) || {
            echo "::error::expected four shard exit records"
            exit 1
          }
          for exit_file in "${exit_files[@]}"; do
            [[ "$(<"$exit_file")" != "1" ]] || {
              echo "::error::run-global audit integrity failure; no verdicts will be published"
              exit 1
            }
          done
          reports=(shard-artifacts/**/security-report.json)
          deltas=(shard-artifacts/**/security-verdict-delta.json)
          (( ${#reports[@]} == 4 && ${#deltas[@]} == 4 )) || {
            echo "::error::every shard must publish report and verdict delta"
            exit 1
          }
          mkdir -p security-reports
          set +e
          uv run python audit_plugins.py \
            --aggregate-reports "${reports[@]}" \
            --aggregate-verdict-deltas "${deltas[@]}" \
            --output-dir security-reports \
            --verdict-delta security-reports/security-verdict-delta.json
          audit_exit=$?
          set -e
          echo "audit_exit=${audit_exit}" >> "$GITHUB_OUTPUT"
          case "$audit_exit" in
            0 | 2 | 3 | 4)
              echo "publishable=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "publishable=false" >> "$GITHUB_OUTPUT"
              exit "$audit_exit"
              ;;
          esac

      - name: Record aggregation summary
        if: always() && steps.aggregate.outputs.audit_exit != ''
        run: |
          {
            echo "## Scheduled security audit aggregation"
            echo
            if [[ "${{ steps.aggregate.outputs.publishable }}" == "true" ]]; then
              echo "Four isolated shard reports and verdict deltas were merged."
            else
              echo "Aggregation failed integrity checks; no aggregate evidence was published."
            fi
            echo "Aggregate exit: ${{ steps.aggregate.outputs.audit_exit }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge publishable verdict delta
        if: steps.aggregate.outputs.publishable == 'true'
        run: |
          uv run python - security-verdicts.json security-reports/security-verdict-delta.json <<'PY'
          import json
          import os
          import sys
          import tempfile

          verdict_path, delta_path = map(os.fspath, sys.argv[1:])
          with open(verdict_path, encoding="utf-8") as verdict_file:
              verdicts = json.load(verdict_file)
          with open(delta_path, encoding="utf-8") as delta_file:
              delta = json.load(delta_file)
          if not isinstance(verdicts, dict) or not isinstance(delta, dict):
              raise SystemExit("verdict store or delta root is not an object")
          for repository, releases in delta.items():
              if not isinstance(releases, dict):
                  raise SystemExit(f"invalid delta repository: {repository}")
              verdicts.setdefault(repository, {}).update(releases)
          descriptor, temporary = tempfile.mkstemp(
              dir=os.path.dirname(verdict_path) or ".",
              prefix=".security-verdicts.",
              suffix=".tmp",
          )
          with os.fdopen(descriptor, "w", encoding="utf-8") as output:
              json.dump(verdicts, output, indent=2, sort_keys=True)
              output.write("\n")
              output.flush()
              os.fsync(output.fileno())
          os.replace(temporary, verdict_path)
          PY

      - name: Snapshot published verdicts
        if: steps.aggregate.outputs.publishable == 'true'
        run: git show HEAD:security-verdicts.json > "$RUNNER_TEMP/security-verdicts-before.json"

      - name: Publish updated verdicts
        if: steps.aggregate.outputs.publishable == 'true'
        env:
          BEFORE_VERDICTS: ${{ runner.temp }}/security-verdicts-before.json
        run: |
          if git diff --quiet -- security-verdicts.json; then
            echo "No verdict changes to publish."
            exit 0
          fi

          changed_count=$(uv run python - "$BEFORE_VERDICTS" security-verdicts.json <<'PY'
          import json
          import sys

          def flatten(path):
              with open(path, encoding="utf-8") as verdict_file:
                  verdicts = json.load(verdict_file)
              return {
                  (repository, release_id): verdict
                  for repository, releases in verdicts.items()
                  for release_id, verdict in releases.items()
              }

          before = flatten(sys.argv[1])
          after = flatten(sys.argv[2])
          changed = sum(
              before.get(key) != after.get(key) for key in before.keys() | after.keys()
          )
          print(changed)
          PY
          )

          git config user.name "decky-plugins-extended audit bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- security-verdicts.json
          git commit -m "chore(security): publish ${changed_count} changed verdicts"

          git status --porcelain
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi

          echo "Initial verdict push raced with another update; rebasing and retrying once."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforcement result
        if: always() && steps.aggregate.outputs.audit_exit != ''
        env:
          AUDIT_EXIT: ${{ steps.aggregate.outputs.audit_exit }}
        run: |
          case "$AUDIT_EXIT" in
            0) echo "Audit clean under the current enforcement mode." ;;
            2) echo "::error::Audit produced BLOCK findings."; exit 2 ;;
            3) echo "::warning::Audit produced MANUAL_REVIEW findings." ;;
            4) echo "::error::Audit has publishable release-local incompleteness."; exit 4 ;;
            *) echo "::error::unexpected audit exit $AUDIT_EXIT"; exit 1 ;;
          esac

      - name: Upload aggregate scheduled evidence
        if: always() && steps.aggregate.outputs.publishable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-security-audit-aggregate
          path: security-reports
          retention-days: 90
          if-no-files-found: warn
