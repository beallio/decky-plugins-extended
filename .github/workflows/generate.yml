name: Generate Plugin JSON

on:
  push:
    branches: [ "main" ]
    paths:
      - 'additional_plugins.txt'
      - 'store_plugins.txt'
      - 'store_sources.json'
      - 'plugin_release_utils.py'
      - 'store_discovery.py'
      - 'generate_json.py'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Every 6 hours. A rebuild re-hashes any release zip GitHub has no digest
    # for, so this is heavier than the check that gates it.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy the current main branch even when catalog data is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "generate"
  cancel-in-progress: false

jobs:
  # Cloudflare Pages runs the generator itself on every push, so this job does
  # not publish anything: it is a pre-flight check that the catalog still builds
  # and validates before Cloudflare tries the same thing.
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        # No floating v9 major tag is published upstream, so pin the exact version.
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: 'pyproject.toml'

      # Regenerate rather than --check: upstream can publish a release between
      # the last refresh commit and this push, and stale catalog data is the
      # refresh job's to publish, not this job's to fail on.
      - name: Refresh official catalog source data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run store_discovery.py

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run generate_json.py

  # Cloudflare only rebuilds on push, so without this the catalog stays frozen at
  # whatever upstream looked like at the last deploy. Check first and only spend a
  # rebuild when something actually moved.
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: 'pyproject.toml'

      - name: Refresh official catalog source data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run store_discovery.py

      # This job is the single writer of the generated catalog data. A push made
      # with GITHUB_TOKEN raises no workflow event, so committing here cannot
      # loop back into this workflow, but Cloudflare does rebuild on it.
      - name: Publish refreshed catalog source data
        id: publish
        run: |
          tracked='store_plugins.txt store_versions.json store_sources.json'
          if git diff --quiet -- $tracked; then
            echo "Catalog source data is already current."
            exit 0
          fi

          git config user.name "decky-plugins-extended catalog bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $tracked
          git commit -m "chore(catalog): refresh official store source data"

          git status --porcelain
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Initial catalog push raced with another update; rebasing and retrying once."
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Check for upstream and plugin updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run check_for_updates.py

      # The commit above already pushed, and Cloudflare rebuilds on push, so the
      # hook would only buy a duplicate build.
      - name: Trigger a Cloudflare rebuild
        if: steps.publish.outputs.pushed != 'true' && (inputs.force_deploy == true || steps.check.outputs.changed == 'true')
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK secret is not set; cannot trigger a rebuild."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Requested a Cloudflare rebuild."
