name: Generate Plugin JSON

on:
  push:
    branches: [ "main" ]
    paths:
      - 'additional_plugins.txt'
      - 'generate_json.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

concurrency:
  group: "generate"
  cancel-in-progress: false

jobs:
  # Cloudflare Pages runs the generator itself on every push, so this job does
  # not publish anything: it is a pre-flight check that the catalog still builds
  # and validates before Cloudflare tries the same thing.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        # No floating v9 major tag is published upstream, so pin the exact version.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run generate_json.py
